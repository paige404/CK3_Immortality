---
name: Tiger Validate
on:
  push:
    branches:
      - master
    paths-ignore:
      - descriptor.mod
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out Tiger action
        uses: actions/checkout@v7
        with:
          repository: ddbb07/tiger-action
          ref: main
          path: validation
          token: ${{ secrets.VALIDATION_TOKEN }}
          persist-credentials: false
      - name: Validate mod
        uses: ./validation/
        with:
          action-directory: validation
          game: ck3
          update-tiger: true
